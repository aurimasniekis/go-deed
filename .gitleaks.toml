title = "deed gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholder token shapes in docs and tests; synthetic planted secrets in redaction fixtures; local artefacts"
paths = [
  '''(^|/)node_modules/''',
  '''^bin/''',
  '''(^|/)\.claude/''',
  '''deploy/dev/secrets/''',
]
regexes = [
  '''deed_(at|st)_(EXAMPLE|test|x)[A-Za-z0-9_]*''',
  '''PLANTED-SECRET[A-Za-z0-9_-]*''',
  '''deed-dev-secret''',
  '''deedtest-secret''',
  '''deedsmoke-secret''',
  '''deedci-secret''',
  '''acme-api-[a-z0-9.-]+''',                # relation names in connector tests
  '''ten_01jb9w2v3x4y5z6a7b8c9d0e[0-9a-z]{2}''', # NATS subject tokens in Pulse admin fixtures
]
