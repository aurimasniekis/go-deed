# Adapted from Porch .github/workflows/ci.yaml (Apache-2.0). Actions are pinned by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * *" # nightly: longer fuzzing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  NODE_VERSION: "24.22.0"

jobs:
  detect:
    name: detect optional parts
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.d.outputs.web }}
      e2e: ${{ steps.d.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: d
        run: |
          echo "web=$([[ -f web/package.json ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "e2e=$([[ -f web/playwright.config.ts ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"

  go:
    name: go (fmt, lint, vet, race tests with NATS and MinIO, drift, fuzz smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: make fmt-check vet txscope tools-test openapi-check monitoring-check
      - name: NATS (JetStream) and MinIO for integration tests
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde -js
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=deedci -e MINIO_ROOT_PASSWORD=deedci-secret \
            cgr.dev/chainguard/minio:latest@sha256:73297936408b731668ca0e835ac9add1a35cb6026a125c2f0cd476d9ef48222c server /data
      - name: race tests
        env:
          DEED_TEST_TX_MAX: 500ms # race detector overhead on shared runners (local guard: 100 ms)
          DEED_TEST_NATS: nats://127.0.0.1:4222
          DEED_TEST_S3: http://deedci:deedci-secret@127.0.0.1:9000
        run: make race
      - name: fuzz smoke
        run: make fuzz-smoke FUZZTIME=${{ github.event_name == 'schedule' && '5m' || '10s' }}

  web:
    name: web (typecheck, lint, unit tests, build, dist check)
    runs-on: ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web-install web-check web-build
      - name: generated API client is current
        run: |
          make web-gen
          git diff --exit-code -- web/src/api/schema.gen.ts || { echo "::error::run make web-gen"; exit 1; }

  e2e:
    name: browser e2e (Playwright, Chromium, axe)
    runs-on: ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.e2e == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: install
        run: make web-install && pnpm --dir web exec playwright install --with-deps chromium
      - run: make web-build build
      - run: make web-e2e

  container:
    name: container image + smoke test
    runs-on: ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: deed:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - run: scripts/container-smoke.sh deed:ci

  security:
    name: security (govulncheck, gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --config .gitleaks.toml .
