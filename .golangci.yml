version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    depguard:
      rules:
        no-insecure-random:
          files:
            - "!$test"
          deny:
            - pkg: math/rand
              desc: use crypto/rand; Deed is security-sensitive
            - pkg: math/rand/v2
              desc: use crypto/rand; Deed is security-sensitive
        no-legacy-log:
          files:
            - "!**/cmd/**"
            - "!**/test/**"
            - "!**/examples/**"
            - "!$test"
          deny:
            - pkg: log$
              desc: use log/slog through internal/obs
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print.*|print|println)$
          msg: use structured logging; only cmd/ may print
    gosec:
      excludes:
        - G104 # covered by errcheck
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: (cmd|test|examples)/
        linters: [forbidigo]
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, contextcheck]
    paths:
      - tools/analyzers/.*/testdata

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aurimasniekis/go-deed
