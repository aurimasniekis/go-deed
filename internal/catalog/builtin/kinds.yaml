        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            stream:
              type: string
            subjects:
              type: array
              items:
                type: string
            storage:
              type: string
            retention:
              type: string
            max_bytes:
              type: integer
            replicas:
              type: integer
              minimum: 0
            messages:
              type: integer
              minimum: 0
            bytes:
              type: integer
              minimum: 0
          additionalProperties: true
  - name: nats_consumer
    group: events
