# Built-in kinds (ADR-002). Loaded at start-up into kind_definitions with builtin = 1. Edit and rebuild to change.
kinds:
  - name: server
    group: infra
    title: Server
    plural: Servers
    icon: tabler:server
    description: Physical server or dedicated host.
    identity_keys:
      - - /spec/hostname
      - - /spec/ipv4
      - - /spec/serial
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            hostname:
              type: string
              maxLength: 253
            ipv4:
              type: string
              format: ipv4
            ipv6:
              type: string
              format: ipv6
            provider:
              type: string
            model:
              type: string
            serial:
              type: string
            cpu_cores:
              type: integer
              minimum: 0
            memory_mb:
              type: integer
              minimum: 0
            os:
              type: string
            region:
              type: string
            datacenter:
              type: string
          additionalProperties: true
  - name: hypervisor
    group: infra
    title: Hypervisor
    plural: Hypervisors
    icon: tabler:server-2
    description: Virtualization host, e.g. ESXi or Proxmox.
    identity_keys:
      - - /spec/hostname
      - - /spec/ipv4
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            hostname:
              type: string
              maxLength: 253
            ipv4:
              type: string
              format: ipv4
            ipv6:
              type: string
              format: ipv6
            platform:
              type: string
              enum:
                - esxi
                - proxmox
                - kvm
                - hyper-v
                - xen
                - other
            version:
              type: string
            cluster:
              type: string
          additionalProperties: true
  - name: vm
    group: infra
    title: Virtual machine
    plural: Virtual machines
    icon: tabler:box
    description: Virtual machine or VPS instance.
    identity_keys:
      - - /spec/hostname
      - - /spec/ipv4
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            hostname:
              type: string
              maxLength: 253
            ipv4:
              type: string
              format: ipv4
            ipv6:
              type: string
              format: ipv6
            provider:
              type: string
            instance_type:
              type: string
            image:
              type: string
            cpu_cores:
              type: integer
              minimum: 0
            memory_mb:
              type: integer
              minimum: 0
            disk_gb:
              type: integer
              minimum: 0
            region:
              type: string
            os:
              type: string
            status:
              type: string
          additionalProperties: true
  - name: container
    group: infra
    title: Container
    plural: Containers
    icon: simple-icons:docker
    description: Container running on a Docker host or runtime.
    identity_keys: []
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            image:
              type: string
            image_tag:
              type: string
            image_digest:
              type: string
            state:
              type: string
            ports:
              type: array
              items:
                type: string
            compose_project:
              type: string
            compose_service:
              type: string
            restart_policy:
              type: string
          additionalProperties: true
  - name: docker_host
    group: infra
    title: Docker host
    plural: Docker hosts
    icon: simple-icons:docker
    description: Machine running a Docker engine.
    identity_keys:
      - - /spec/hostname
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            hostname:
              type: string
              maxLength: 253
            ipv4:
              type: string
              format: ipv4
            ipv6:
              type: string
              format: ipv6
            docker_version:
              type: string
            containers_running:
              type: integer
              minimum: 0
          additionalProperties: true
  - name: storage
    group: infra
    title: Storage
    plural: Storage
    icon: tabler:database-export
    description: Bucket, volume or file share.
    identity_keys:
      - - /spec/endpoint
        - /spec/bucket
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            type:
              type: string
              enum:
                - s3
                - bucket
                - nfs
                - smb
                - disk
                - volume
                - other
            endpoint:
              type: string
            bucket:
              type: string
            capacity_gb:
              type: number
              minimum: 0
            provider:
              type: string
          additionalProperties: true
  - name: database
    group: infra
    title: Database
    plural: Databases
    icon: tabler:database
    description: Database server or logical database.
    identity_keys: []
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            engine:
              type: string
            version:
              type: string
            host:
              type: string
            port:
              type: integer
              minimum: 0
              maximum: 65535
            database:
              type: string
          additionalProperties: true
  - name: network
    group: network
    title: Network
    plural: Networks
    icon: tabler:network
    description: IP network, VLAN or VPC.
    identity_keys:
      - - /spec/cidr
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            cidr:
              type: string
            vlan:
              type: integer
              minimum: 0
              maximum: 4095
            type:
              type: string
            gateway:
              type: string
          additionalProperties: true
  - name: domain
    group: network
    title: Domain
    plural: Domains
    icon: tabler:world-www
    description: Registered domain name.
    identity_keys:
      - - /spec/fqdn
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            fqdn:
              type: string
            registrar:
              type: string
            expires_at:
              type: string
              format: date-time
            nameservers:
              type: array
              items:
                type: string
            auto_renew:
              type: boolean
          additionalProperties: true
  - name: dns_zone
    group: network
    title: DNS zone
    plural: DNS zones
    icon: tabler:world
    description: Authoritative DNS zone (e.g. a Cloudflare zone).
    identity_keys:
      - - /spec/zone
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            zone:
              type: string
            provider:
              type: string
            zone_id:
              type: string
            plan:
              type: string
          additionalProperties: true
  - name: dns_record
    group: network
    title: DNS record
    plural: DNS records
    icon: tabler:arrow-guide
    description: DNS resource record.
    identity_keys:
      - - /spec/fqdn
        - /spec/type
        - /spec/content
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            fqdn:
              type: string
            type:
              type: string
            content:
              type: string
            ttl:
              type: integer
              minimum: 0
            proxied:
              type: boolean
            zone:
              type: string
            priority:
              type: integer
          additionalProperties: true
  - name: certificate
    group: network
    title: Certificate
    plural: Certificates
    icon: tabler:certificate
    description: X.509 certificate.
    identity_keys:
      - - /spec/fingerprint_sha256
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            common_name:
              type: string
            sans:
              type: array
              items:
                type: string
            issuer:
              type: string
            not_before:
              type: string
              format: date-time
            not_after:
              type: string
              format: date-time
            serial:
              type: string
            fingerprint_sha256:
              type: string
            key_algorithm:
              type: string
          additionalProperties: true
  - name: service
    group: software
    title: Service
    plural: Services
    icon: tabler:components
    description: 'Running service: something that serves requests or processes events.'
    identity_keys:
      - - /spec/pulse_client_id
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            url:
              type: string
            port:
              type: integer
              minimum: 0
              maximum: 65535
            protocol:
              type: string
            tier:
              type: string
            pulse_client_id:
              type: string
            health_url:
              type: string
          additionalProperties: true
  - name: application
    group: software
    title: Application
    plural: Applications
    icon: tabler:apps
    description: Logical application composed of services.
    identity_keys: []
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            language:
              type: string
            framework:
              type: string
            url:
              type: string
          additionalProperties: true
  - name: repository
