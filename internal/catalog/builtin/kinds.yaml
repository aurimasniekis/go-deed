            ref:
              type: string
            sha:
              type: string
            status:
              type: string
            url:
              type: string
            deployed_at:
              type: string
              format: date-time
          additionalProperties: true
  - name: pull_request
    group: software
    title: Pull request
    plural: Pull requests
    icon: tabler:git-pull-request
    description: Pull request (open or recently closed).
    identity_keys:
      - - /spec/url
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            number:
              type: integer
              minimum: 0
            title:
              type: string
            state:
              type: string
            url:
              type: string
            author:
              type: string
            merged:
              type: boolean
            draft:
              type: boolean
            updated_at:
              type: string
              format: date-time
            repository:
              type: string
          additionalProperties: true
  - name: issue
    group: software
    title: Issue
    plural: Issues
    icon: tabler:circle-dot
    description: Issue (open or recently closed).
    identity_keys:
      - - /spec/url
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            number:
              type: integer
              minimum: 0
            title:
              type: string
            state:
              type: string
            url:
              type: string
            labels:
              type: array
              items:
                type: string
            updated_at:
              type: string
              format: date-time
            repository:
              type: string
          additionalProperties: true
  - name: nats_system
    group: events
    title: NATS system
    plural: NATS systems
    icon: simple-icons:natsdotio
