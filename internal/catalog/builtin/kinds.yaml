            url:
              type: string
            provider:
              type: string
            full_name:
              type: string
            default_branch:
              type: string
            visibility:
              type: string
            archived:
              type: boolean
            language:
              type: string
          additionalProperties: true
  - name: release
    group: software
    title: Release
    plural: Releases
    icon: tabler:tag
    description: Published release of a repository.
    identity_keys: []
    versions:
      - version: v1
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          properties:
            tag:
              type: string
            name:
              type: string
            published_at:
              type: string
              format: date-time
            url:
              type: string
            prerelease:
              type: boolean
            draft:
              type: boolean
          additionalProperties: true
  - name: deployment
    group: software
    title: Deployment
