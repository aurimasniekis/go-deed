          type: object
          properties:
            type:
              type: string
            version:
              type: string
            schema:
              type: object
            description:
              type: string
          additionalProperties: true
  - name: grafana_dashboard
    group: observability
    title: Grafana dashboard
    plural: Grafana dashboards
    icon: simple-icons:grafana
