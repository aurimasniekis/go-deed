# Development and validation stack (scripts/e2e.sh). Dependencies only by default; Deed itself runs on the host
# (make run / bin/deed serve -config deploy/dev/deed.yaml) or in a container with --profile app.
#
#   docker compose -f deploy/compose.dev.yaml up -d                 # nats, minio, prometheus, loki, grafana
#   docker compose -f deploy/compose.dev.yaml --profile app up -d   # plus deed built from this checkout
#
# Every port binds to 127.0.0.1. Credentials here are development-only placeholders.
name: deed-dev

services:
  nats:
    image: nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports: ["127.0.0.1:34222:4222", "127.0.0.1:38222:8222"]
    volumes: [nats-data:/data]

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:73297936408b731668ca0e835ac9add1a35cb6026a125c2f0cd476d9ef48222c
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: deed-dev
      MINIO_ROOT_PASSWORD: deed-dev-secret
    ports: ["127.0.0.1:39000:9000"]
    volumes: [minio-data:/data]

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest@sha256:5830e3a2faa7b2141c07675976240759afcda4cab7a9c25011adf5ca056fb142
    depends_on: [minio]
    environment:
      MC_HOST_dev: http://deed-dev:deed-dev-secret@minio:9000
    command: ["mb", "--ignore-existing", "dev/deed-backups", "dev/deed-tfstate"]
    restart: on-failure:20

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./dev/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/deed-alerts.yaml:/etc/prometheus/rules/deed-alerts.yaml:ro
    ports: ["127.0.0.1:39190:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  loki:
    image: grafana/loki:3.5.5@sha256:31628519045e7f28692a7ae73b4a3fd293dccb425585ed5d16ceea3b5c9592e6
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: [./dev/loki/loki.yaml:/etc/loki/loki.yaml:ro]
    ports: ["127.0.0.1:33100:3100"]

  grafana:
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: deed-dev-admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./dev/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/deed-dashboard.json:/var/lib/grafana/dashboards/deed.json:ro
    ports: ["127.0.0.1:33000:3000"]
    depends_on: [prometheus, loki]

  deed:
    profiles: [app]
    build:
      context: ..
      dockerfile: Dockerfile
    image: deed:local
    environment:
      DEED_PUBLIC_URL: http://127.0.0.1:38080
      DEED_MODE: development
    secrets: [deed_kek]
    volumes: [deed-data:/var/lib/deed]
    ports: ["127.0.0.1:38080:8080"]

secrets:
  deed_kek:
    file: ./dev/secrets/deed_kek

volumes:
  nats-data:
  minio-data:
  deed-data:
