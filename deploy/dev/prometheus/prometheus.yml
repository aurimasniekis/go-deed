global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules/*.yaml]
scrape_configs:
  - job_name: deed
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]   # bin/deed serve -config deploy/dev/deed.yaml
        labels: {instance: deed-host}
      - targets: ["deed:9464"]                   # --profile app
        labels: {instance: deed-container}
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
